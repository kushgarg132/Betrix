name: Deploy Backend to VM

on:
  push:
    branches: [ master ]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, betrix-vm]
    steps:
      # Deploys straight from the runner workspace. The gitignored .env is placed
      # there once by hand; clean: false keeps checkout from deleting it.
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Rebuild and restart backend
        run: docker compose up -d --build backend

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8083/swagger-ui/index.html; then echo healthy; exit 0; fi
            sleep 3
          done
          docker logs --tail 50 betrix-backend
          exit 1
