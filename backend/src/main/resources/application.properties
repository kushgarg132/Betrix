server.port=${SERVER_PORT}
spring.application.name=${SPRING_APPLICATION_NAME}
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=${APP_JWT_EXPIRATION}
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
# Creates the unique googleSub index declared on User
spring.data.mongodb.auto-index-creation=true

# Enable Spring scheduling
spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=scheduler-
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=60s

game.scheduler.round-end-delay=${GAME_ROUND_END_DELAY}
game.scheduler.player-timeout-delay=${GAME_PLAYER_TIMEOUT_DELAY}


# Actuator: health only, no component details (deploy + container HEALTHCHECK poll it unauthenticated)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# CORS: exact origins only (credentials are allowed). Override with APP_CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://betrix-b3c24.web.app,https://betrix-b3c24.firebaseapp.com,http://localhost:3000,http://localhost:5173}

# Play money: chips every player sits down with at any table
game.buy-in=${GAME_BUY_IN:10000}

# Max login/register/guestLogin attempts per client IP per minute
app.rate-limit.auth-per-minute=${APP_AUTH_RATE_LIMIT_PER_MINUTE:20}

# Dev tooling is off unless switched on (the local profile turns it on)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# GraphQL
spring.graphql.graphiql.enabled=${GRAPHIQL_ENABLED:false}
spring.graphql.schema.introspection.enabled=${GRAPHQL_INTROSPECTION_ENABLED:false}
spring.graphql.graphiql.path=/graphiql
spring.graphql.schema.locations=classpath:graphql/
spring.graphql.websocket.path=/graphql
spring.graphql.cors.allowed-origins=${app.cors.allowed-origins}
spring.graphql.cors.allowed-methods=GET,POST

# Gemini Bot
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.model-hard=${GEMINI_MODEL_HARD:gemini-2.5-pro}
# Bots stop calling Gemini (and play locally) past this many calls per minute, across all tables
gemini.max-calls-per-minute=${GEMINI_MAX_CALLS_PER_MINUTE:30}

# Google Sign-In: the OAuth 2.0 web client id (Google Cloud Console). Required; startup fails if blank.
google.client-id=${GOOGLE_CLIENT_ID:}
# Comma-separated Google account emails that get the ADMIN role at sign-in
app.admin-emails=${APP_ADMIN_EMAILS:}
